name: Deploy Web (Vercel)

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VERCEL_PROJECT_NAME: anthony-holidays

jobs:
  # dev  → Vercel Preview
  # main → Vercel Production
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set Vercel target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create .env file
        run: |
          {
            echo "BACKEND_URL=${{ vars.BACKEND_URL }}"
            echo "FRONTEND_URL=${{ vars.FRONTEND_URL }}"
            echo "PUBLIC_WHATSAPP_NUMBER=${{ vars.PUBLIC_WHATSAPP_NUMBER }}"
            echo "PUBLIC_PHONE_NUMBER=\"${{ vars.PUBLIC_PHONE_NUMBER }}\""
            echo "COMPANY_EMAIL=${{ vars.COMPANY_EMAIL }}"
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}"
            echo "NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}"
          } > apps/web/.env.production

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          vercel link \
            --yes \
            --project=${{ env.VERCEL_PROJECT_NAME }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment info
        run: |
          vercel pull \
            --yes \
            --environment=${{ steps.target.outputs.environment }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      # Server-only values for API routes (emails, bot checks), set as runtime env on the deployment
      - name: Deploy to Vercel
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ vars.RESEND_FROM_NAME }}
          COMPANY_EMAIL: ${{ vars.COMPANY_EMAIL }}
          ENQUIRY_NOTIFICATION_EMAIL: ${{ vars.ENQUIRY_NOTIFICATION_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
        run: |
          vercel deploy \
            --prebuilt \
            ${{ steps.target.outputs.prod_flag }} \
            --env RESEND_API_KEY="$RESEND_API_KEY" \
            --env RESEND_FROM_EMAIL="$RESEND_FROM_EMAIL" \
            --env RESEND_FROM_NAME="$RESEND_FROM_NAME" \
            --env COMPANY_EMAIL="$COMPANY_EMAIL" \
            --env ENQUIRY_NOTIFICATION_EMAIL="$ENQUIRY_NOTIFICATION_EMAIL" \
            --env TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY" \
            --env RECAPTCHA_SECRET_KEY="$RECAPTCHA_SECRET_KEY" \
            --token=${{ secrets.VERCEL_TOKEN }}
